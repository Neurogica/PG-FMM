[project]
name = "pgfmm"
version = "1.0.0"
description = "PG-FMM: Physics-Guided Flow-Map Matching for Precipitation Nowcasting (ACCV 2026)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "BSD-3-Clause" }
authors = [{ name = "The PG-FMM Authors" }]
keywords = ["precipitation-nowcasting", "flow-matching", "physics-informed", "radar", "generative-models"]

dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "diffusers>=0.30",
    "accelerate>=0.34",
    "ema-pytorch>=0.7",
    "omegaconf>=2.3",
    "einops>=0.8",
    "numpy>=1.26",
    "h5py>=3.10",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Metrics used by ml/eval.py reuse the AlphaPre benchmark Evaluator (see ml/README.md).
eval = ["lpips>=0.1.4", "pandas>=2.1", "opencv-python-headless>=4.8"]
dev = ["pytest>=8.0", "ruff>=0.6"]


[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "ml" }

[tool.setuptools.packages.find]
where = ["ml"]
include = ["pgfmm*"]

# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["web", "data", "runs", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["pgfmm"]
