# CIKM: 5 input -> 10 output (15 frames per clip).

dataset:
  name: cikm
  img_size: 128
  T_in: 5
  T_out: 10

model:
  base_channels: 96
  channel_mult: [1, 2, 4, 4]
  num_blocks: 2
  max_displacement: 8.0
  source_scale: 0.25

loss:
  lambda_l1: 1.0
  lambda_mse: 0.25
  lambda_soft_csi: 0.02
  lambda_flow_smooth: 0.01
  lambda_source_sparse: 0.001
  pixel_scale: 255.0
  thresholds: [20.0, 30.0, 35.0, 40.0]
  soft_csi_sharpness: 8.0

train:
  batch_size: 16
  num_workers: 8
  lr: 1.0e-4
  weight_decay: 0.01
  ema_rate: 0.999
  warmup_steps: 2000
  total_steps: 40_000
  grad_clip: 1.0
  mixed_precision: bf16
  log_every: 50
  ckpt_every: 5000
  val_every: 2000
  val_max_batches: 20
